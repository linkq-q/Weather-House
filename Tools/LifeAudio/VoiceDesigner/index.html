<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动物声工作台 · 天气屋</title>
<style>
:root{color-scheme:light;--paper:#f7f9fa;--background:#eaf1f3;--ink:#32364b;--muted:#616879;--accent:#26666b;--line:#ccd9de;--selected:#d9e9e9;--lavender:#e6def4}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;line-height:1.65}main{width:min(1040px,calc(100% - 48px));margin:46px auto}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:26px}h1{font-size:28px;font-weight:650;letter-spacing:.03em;margin:0}header p{margin:0;color:var(--muted);font-size:14px}.workbench{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.animals{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);background:#f0f5f6}.animal{appearance:none;border:0;border-right:1px solid var(--line);padding:17px 8px;color:var(--muted);background:transparent;font:inherit;cursor:pointer}.animal:last-child{border-right:0}.animal strong{display:block;font-size:20px;color:var(--ink);font-weight:600}.animal span{display:block;font-size:12px}.animal[aria-pressed="true"]{background:var(--selected);box-shadow:inset 0 -4px var(--accent)}.animal:hover{background:#e0eded}.body{display:grid;grid-template-columns:1fr 1fr;gap:42px;padding:34px}.voice h2{font-family:"KaiTi","STKaiti",serif;font-size:54px;line-height:1.1;font-weight:400;margin:0 0 14px}.voice p{font-size:14px;color:var(--muted);margin:0 0 24px}.wave{padding:14px 14px 10px;background:#edf3f4;border-radius:8px}canvas{width:100%;height:102px;display:block}.wave-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.controls{display:grid;gap:20px}.control-header{display:flex;justify-content:space-between;font-size:15px}.control-header label{font-weight:600}.control-header output{color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums}.range-hints{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:0}input[type=range]{width:100%;height:24px;margin:6px 0 0;accent-color:var(--accent);cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:23px}button,.export{font:inherit;font-size:14px;cursor:pointer;border-radius:7px;border:1px solid #b4c6cd;background:white;color:var(--ink);padding:9px 17px;text-decoration:none;text-align:center}.primary{background:var(--accent);color:white;border-color:var(--accent)}.export{background:var(--lavender);border-color:#c8bbde}.reset{justify-self:start;padding:4px 0;border:0;background:transparent;font-size:13px;text-decoration:underline;text-underline-offset:4px;color:var(--muted)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #8465a6;outline-offset:4px}.status{min-height:25px;font-size:13px;margin:13px 0 0;color:var(--accent)}.note{border-top:1px solid var(--line);padding:17px 34px;font-size:13px;color:var(--muted)}.note p{margin:0}.note p+p{margin-top:3px}footer{font-size:12px;color:var(--muted);margin-top:16px}footer a{color:var(--accent)}@media(max-width:700px){main{width:calc(100% - 28px);margin:22px auto}header{display:block}header p{margin-top:5px}.body{grid-template-columns:1fr;padding:24px;gap:26px}.animals span{display:none}.animal{padding:14px 4px}.animal strong{font-size:17px}.voice h2{font-size:44px}.voice p{margin-bottom:16px}.note{padding:16px 24px}.controls{gap:17px}.actions>*{flex:1;padding:9px 8px}h1{font-size:25px}}
</style>
</head>
<body>
<main>
  <header><h1>动物声工作台</h1><p>天气屋 · 制作者离线工具</p></header>
  <section class="workbench" aria-label="动物短音节制作">
    <nav class="animals" aria-label="动物预设">
      <button class="animal" data-animal="dog" aria-pressed="true"><strong>狗</strong><span>圆润短促</span></button>
      <button class="animal" data-animal="squirrel" aria-pressed="false"><strong>松鼠</strong><span>轻巧跳跃</span></button>
      <button class="animal" data-animal="fox" aria-pressed="false"><strong>狐</strong><span>清软抑扬</span></button>
      <button class="animal" data-animal="sheep" aria-pressed="false"><strong>羊</strong><span>蓬松舒缓</span></button>
      <button class="animal" data-animal="deer" aria-pressed="false"><strong>鹿</strong><span>温和沉静</span></button>
    </nav>
    <div class="body">
      <section class="voice" aria-label="声音试听">
        <h2 id="animalName">狗</h2>
        <p id="character">圆润、短促，句尾轻轻下落</p>
        <div class="wave">
          <canvas id="waveform" width="800" height="204" aria-label="当前短句音频波形"></canvas>
          <div class="wave-caption"><span>六个原创短音节</span><span id="duration"></span></div>
        </div>
        <div class="actions">
          <button class="primary" id="play">试听这句</button>
          <button id="stop" disabled>停止</button>
          <a class="export" id="export" download>导出 WAV</a>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">选一个动物，听听它的说话节奏。</p>
      </section>
      <section class="controls" aria-label="声线参数">
        <div><div class="control-header"><label for="pitch">音高</label><output for="pitch" id="pitchValue"></output></div><input type="range" id="pitch" min="-12" max="12" step="1" value="0"><div class="range-hints"><span>低一些</span><span>高一些</span></div></div>
        <div><div class="control-header"><label for="speed">速度</label><output for="speed" id="speedValue"></output></div><input type="range" id="speed" min="0.65" max="3" step="0.05" value="1"><div class="range-hints"><span>舒缓</span><span>轻快</span></div></div>
        <div><div class="control-header"><label for="timbre">音色</label><output for="timbre" id="timbreValue"></output></div><input type="range" id="timbre" min="0" max="100" step="1" value="35"><div class="range-hints"><span>温润</span><span>明亮</span></div></div>
        <div><div class="control-header"><label for="variation">起伏</label><output for="variation" id="variationValue"></output></div><input type="range" id="variation" min="0" max="100" step="1" value="45"><div class="range-hints"><span>平稳</span><span>活泼</span></div></div>
        <button class="reset" id="reset">恢复当前动物预设</button>
      </section>
    </div>
    <div class="note"><p>选择预设，再用四个滑杆微调。试听与导出使用同一段声音。</p><p>同物种的关键动物与次级动物共用声线。导出为 44.1 kHz、16 位、单声道 WAV。</p></div>
  </section>
  <footer>声音由本地程序合成，未使用游戏录音或仿真动物叫声。文件可离线打开，无需安装或联网。</footer>
</main>
<script src="voice-engine.js"></script>
<script>
'use strict';
const engine = window.VoiceDesigner;
const controls = ['pitch', 'speed', 'timbre', 'variation'];
const element = id => document.getElementById(id);
let animal = 'dog', current, context, source, downloadUrl, playbackRequest = 0;
function stop() {
  playbackRequest++;
  if (source) { source.onended = null; source.stop(); source = null; }
  element('play').disabled = false;
  element('stop').disabled = true;
}
function draw(samples) {
  const canvas = element('waveform'), pen = canvas.getContext('2d');
  pen.clearRect(0, 0, canvas.width, canvas.height);
  pen.strokeStyle = '#bfced4'; pen.lineWidth = 1;
  pen.beginPath(); pen.moveTo(0, 102); pen.lineTo(800, 102); pen.stroke();
  pen.strokeStyle = '#26666b'; pen.lineWidth = 2;
  pen.beginPath();
  for (let x = 0; x < 800; x += 2) {
    const start = Math.floor(x / 800 * samples.length), end = Math.floor((x + 2) / 800 * samples.length);
    let min = 0, max = 0;
    for (let i = start; i < end; i++) { min = Math.min(min, samples[i]); max = Math.max(max, samples[i]); }
    pen.moveTo(x, 102 - max * 110); pen.lineTo(x, 102 - min * 110);
  }
  pen.stroke();
}
function update(message = '参数已更新，可以试听或导出。') {
  stop();
  try {
    const params = Object.fromEntries(controls.map(id => [id, Number(element(id).value)]));
    current = engine.render(animal, params);
    element('pitchValue').textContent = `${params.pitch > 0 ? '+' : ''}${params.pitch} 半音`;
    element('speedValue').textContent = `${params.speed.toFixed(2)} 倍`;
    element('timbreValue').textContent = `${params.timbre}%`;
    element('variationValue').textContent = `${params.variation}%`;
    element('duration').textContent = `${(current.samples.length / engine.sampleRate).toFixed(2)} 秒`;
    draw(current.samples);
    if (downloadUrl) URL.revokeObjectURL(downloadUrl);
    downloadUrl = URL.createObjectURL(new Blob([engine.encodeWav(current.samples)], { type: 'audio/wav' }));
    element('export').href = downloadUrl;
    element('export').download = `${engine.presets[animal].name}_短音节_音高${params.pitch}_速度${params.speed.toFixed(2)}_音色${params.timbre}_起伏${params.variation}.wav`;
    element('status').textContent = message;
  } catch (error) {
    current = null;
    element('play').disabled = true;
    element('export').removeAttribute('href');
    element('status').textContent = error.message;
  }
}
function selectAnimal(id) {
  animal = id;
  const preset = engine.presets[id];
  document.querySelectorAll('[data-animal]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.animal === id)));
  element('animalName').textContent = preset.name;
  element('character').textContent = preset.character;
  for (const key of controls) element(key).value = preset.defaults[key];
  update(`已载入${preset.name}的预设。`);
}
document.querySelectorAll('[data-animal]').forEach(button => button.addEventListener('click', () => selectAnimal(button.dataset.animal)));
controls.forEach(id => element(id).addEventListener('input', () => update()));
element('reset').addEventListener('click', () => selectAnimal(animal));
element('stop').addEventListener('click', () => { stop(); element('status').textContent = '已停止，可以继续调音。'; });
element('play').addEventListener('click', async () => {
  try {
    stop();
    const request = playbackRequest;
    element('play').disabled = true;
    context ||= new (window.AudioContext || window.webkitAudioContext)();
    await context.resume();
    if (request !== playbackRequest) return;
    const buffer = context.createBuffer(1, current.samples.length, engine.sampleRate);
    buffer.copyToChannel(current.samples, 0);
    source = context.createBufferSource(); source.buffer = buffer; source.connect(context.destination);
    source.onended = () => { source = null; element('play').disabled = false; element('stop').disabled = true; element('status').textContent = '试听结束，可以微调或导出。'; };
    source.start();
    element('play').disabled = true; element('stop').disabled = false;
    element('status').textContent = `正在试听${engine.presets[animal].name}…`;
  } catch (error) { stop(); element('status').textContent = `试听未开始：${error.message}`; }
});
element('export').addEventListener('click', () => { if (current) element('status').textContent = '已发起 WAV 下载，请在浏览器下载列表查看。'; });
window.addEventListener('pagehide', stop);
selectAnimal('dog');
</script>
</body>
</html>
